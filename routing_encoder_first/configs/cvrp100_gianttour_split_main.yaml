experiment_name: cvrp100_gianttour_split_main
output_root: /public/home/chenrs/project/encoder_test/routing_encoder_first/outputs

seed: 1234

device:
  use_cuda: true
  devices: [0, 1]
  amp: false

data:
  train_distribution: uniform
  train_problem_size: 100
  capacity: 1.0
  train_batch_size: 4
  eval_batch_size: 4
  train_steps: 8
  eval_instances: 4
  size_generalization_sizes: [100, 200]
  distribution_shift_sizes: [100]
  eval_distributions: [uniform, clustered, mixed]
  density_k: 8

model:
  embedding_dim: 128
  num_layers: 6
  num_heads: 8
  ff_dim: 512
  dropout: 0.0
  use_polar: true
  use_local_density: true
  edge_hidden_dim: 32
  topk_outgoing: null
  sparsify_min_n: 200

training:
  lr: 0.0003
  weight_decay: 0.000001
  grad_clip_norm: 1.0
  log_every: 2
  checkpoint_every: 6
  projector_workers: 8
  num_candidates: 8
  eval_num_candidates: 8
  noise_scale: 0.8
  tau_cost: 0.6
  tau_energy: 0.6
  lambda_div: 0.02
  lambda_cons: 0.05
  include_greedy_candidate: true
  anchor_strategy: nearest_depot

validation:
  enabled: false

evaluation:
  enabled: true
  projector_workers: 8
  run_order_baseline: true
  run_no_split_ablation: true
  examples_to_plot: 4
