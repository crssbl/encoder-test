experiment_name: cvrp100_fixedval_pilot_nohup
output_root: /public/home/chenrs/project/encoder_test/routing_encoder_first/outputs

seed: 1234

device:
  use_cuda: true
  devices: [0]
  amp: false

data:
  train_distribution: uniform
  train_problem_size: 100
  capacity: 1.0
  train_batch_size: 160
  eval_batch_size: 16
  train_steps: 2000
  eval_instances: 4
  size_generalization_sizes: [100]
  distribution_shift_sizes: [100]
  eval_distributions: [uniform]
  density_k: 8

model:
  embedding_dim: 512
  num_layers: 10
  num_heads: 8
  ff_dim: 2048
  dropout: 0.0
  use_polar: true
  use_local_density: true
  edge_hidden_dim: 128
  topk_outgoing: null
  sparsify_min_n: 200

training:
  lr: 0.0003
  weight_decay: 0.000001
  grad_clip_norm: 1.0
  log_every: 10
  checkpoint_every: 100
  projector_workers: 8
  num_candidates: 8
  eval_num_candidates: 8
  noise_scale: 0.8
  tau_cost: 0.6
  tau_energy: 0.6
  lambda_div: 0.02
  lambda_cons: 0.05
  include_greedy_candidate: true
  anchor_strategy: nearest_depot

validation:
  enabled: true
  dataset:
    path: /public/home/chenrs/project/encoder_test/PolyNet/CVRP/data/vrp100_valid_seed1233.pkl
  subset_size: 512
  subset_seed: 1335
  batch_size: 16
  small_every: 100
  full_every: 1000
  small_num_candidates: 8
  full_num_candidates: 8
  small_methods: [edge_field_greedy, edge_field_best_of_m]
  full_methods: [edge_field_greedy, edge_field_best_of_m]
  small_projector_workers: 8
  full_projector_workers: 8

evaluation:
  enabled: false
  projector_workers: 8
  run_order_baseline: false
  run_no_split_ablation: false
  examples_to_plot: 0

projector:
  backend: process
  start_method: fork

performance:
  allow_tf32: true
  cudnn_benchmark: true
  float32_matmul_precision: high
